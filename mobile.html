<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8ecef" />
    <meta name="description" content="Мобильный прототип indoor-навигации по комплексу Киностудии Горького" />
    <title>Горький Indoor — мобильный прототип</title>
    <link rel="stylesheet" href="mobile.css?v=mobile-app-1" />
  </head>
  <body>
    <div class="phone-shell">
      <main class="map-screen">
        <header class="search-bar">
          <a class="brand-button" href="index.html?desktop=1" aria-label="Вернуться к полной версии"><span></span><span></span><span></span></a>
          <button class="destination-search" id="destinationSearch">
            <small>Куда идём</small>
            <strong id="searchDestination">Павильон 03</strong>
          </button>
          <button class="profile-button-mobile" aria-label="Профиль">АП</button>
        </header>

        <div class="route-pills" aria-label="Популярные назначения">
          <button class="is-active" data-mobile-route="stage">Павильон 03</button>
          <button data-mobile-route="makeup">Гримёрные</button>
          <button data-mobile-route="cafe">Кафе</button>
        </div>

        <button class="floor-control" id="floorControl"><b>1</b><span>этаж</span><i>⌄</i></button>
        <button class="locate-control" id="locateControl" aria-label="Вернуться к моей позиции">◎</button>

        <svg class="venue-map" viewBox="0 0 430 640" role="img" aria-label="Демонстрационная indoor-карта Киностудии Горького">
          <defs>
            <filter id="buildingShadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334149" flood-opacity=".2" />
            </filter>
            <linearGradient id="parkGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d8e4dd" />
              <stop offset="1" stop-color="#c6d8cd" />
            </linearGradient>
          </defs>

          <rect width="430" height="640" fill="#e8ecef" />
          <path class="road" d="M-35 84L454 18L466 102L-24 168Z" />
          <path class="road-marking" d="M-22 120L446 57" />
          <text class="road-name" x="220" y="94" text-anchor="middle" transform="rotate(-8 220 94)">ВАЛДАЙСКИЙ ПРОЕЗД</text>
          <path class="green-zone" d="M8 184C65 156 104 170 132 214S181 277 205 314L7 353Z" />
          <g class="trees">
            <circle cx="32" cy="208" r="13" /><circle cx="71" cy="191" r="10" />
            <circle cx="51" cy="256" r="16" /><circle cx="102" cy="239" r="12" />
            <circle cx="28" cy="316" r="11" /><circle cx="393" cy="211" r="13" />
            <circle cx="399" cy="474" r="12" />
          </g>
          <text class="demo-label" x="24" y="176">ДЕМО-ПЛАН · КИНОСТУДИЯ ГОРЬКОГО</text>

          <path class="building" filter="url(#buildingShadow)" d="M107 192H379V500H344V576H140V542H78V356H107Z" />
          <g class="rooms">
            <path class="stage-room" d="M120 207H238V332H120Z" />
            <path class="stage-room selected-room" id="stageRoom" d="M251 207H365V332H251Z" />
            <path d="M92 369H171V452H92Z" />
            <path d="M92 465H171V527H92Z" />
            <path d="M287 369H365V452H287Z" />
            <path d="M287 465H365V487H344V527H287Z" />
            <path d="M184 369H274V443H184Z" />
            <path d="M184 456H274V527H184Z" />
            <path d="M153 540H221V562H153Z" />
            <path d="M234 540H331V562H234Z" />
          </g>

          <path class="corridor" d="M107 332H379V356H287V369H274V527H344V540H234V576H221V540H140V527H171V369H184V356H107Z" />
          <g class="doors">
            <path d="M238 323v18M251 323v18M171 390h18M274 390h18M171 480h18M274 480h18M221 540v18M234 540v18" />
          </g>

          <g class="room-names">
            <text x="137" y="248">ПАВИЛЬОН 01</text>
            <text x="268" y="248">ПАВИЛЬОН 03</text>
            <text x="108" y="402">РЕКВИЗИТ</text>
            <text x="108" y="493">ГРИМЁРНЫЕ</text>
            <text x="300" y="402">АППАРАТНАЯ</text>
            <text x="307" y="493">КАФЕ</text>
            <text x="199" y="402">МАССОВКА</text>
            <text x="204" y="486">ПРОСМОТРОВАЯ</text>
          </g>
          <g class="room-types">
            <text x="137" y="266">СЪЁМОЧНЫЙ</text><text x="268" y="266">СЪЁМОЧНЫЙ</text>
            <text x="108" y="419">ХРАНЕНИЕ</text><text x="108" y="510">КОМАНДА</text>
            <text x="300" y="419">ТЕХНИКА</text><text x="307" y="510">ОТДЫХ</text>
          </g>

          <text class="corridor-name" x="230" y="348" text-anchor="middle">ГЛАВНАЯ ГАЛЕРЕЯ</text>
          <path class="entrance-guide" d="M227 623V577" />
          <text class="entrance-name" x="227" y="635" text-anchor="middle">ГЛАВНЫЙ ВХОД</text>

          <polyline id="activeRoutePath" class="active-route" points="227,593 227,551 227,492 227,418 227,345 307,345 307,281" />
          <g id="activeRouteDots" class="route-dots-mobile">
            <circle cx="227" cy="593" r="9" /><circle cx="227" cy="551" r="9" />
            <circle cx="227" cy="418" r="9" /><circle cx="307" cy="281" r="9" />
          </g>
          <g class="qr-marker" transform="translate(227 418)">
            <rect x="-12" y="-12" width="24" height="24" rx="5" />
            <path d="M-6-6h5v5h-5zm8 0h5v5H2zm-8 8h5v5h-5zm8 1h3v3H2z" />
          </g>
          <g id="userPosition" class="user-position" transform="translate(227 593)">
            <circle class="accuracy-ring" r="27" />
            <circle class="position-ring" r="17" />
            <circle class="position-dot" r="7" />
          </g>
          <g id="destinationPin" class="destination-pin-mobile" transform="translate(307 281)">
            <path d="M0-20c-11 0-19 8-19 19 0 14 19 32 19 32S19 13 19-1C19-12 11-20 0-20Z" />
            <circle cy="-1" r="6" />
          </g>
        </svg>

        <div class="map-credit">Схема интерфейса · не официальный план</div>
      </main>

      <section class="route-sheet" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="route-title-row">
          <div>
            <span class="route-status"><i></i> маршрут готов</span>
            <h1 id="sheetDestination">Павильон 03</h1>
          </div>
          <strong id="routeEta">4 мин</strong>
        </div>
        <div class="next-step-card">
          <span class="turn-icon" id="turnIcon">↑</span>
          <div><small>Следующий шаг</small><strong id="nextInstruction">Войдите через главный КПП</strong></div>
          <b id="stepDistance">40 м</b>
        </div>
        <div class="route-meta">
          <span><small>Расстояние</small><strong id="routeDistance">210 м</strong></span>
          <span><small>Точек QR</small><strong>3</strong></span>
          <span><small>Доступ</small><strong>Гость</strong></span>
        </div>
        <button class="start-route-button" id="startRouteButton">Начать маршрут</button>
      </section>

      <nav class="mobile-app-nav" aria-label="Разделы мобильного приложения">
        <button class="is-active"><span>⌖</span>Карта</button>
        <button data-mobile-toast="Запрос павильона откроется в полной версии"><span>□</span>Павильоны</button>
        <button data-mobile-toast="Чек-лист подготовки откроется в полной версии"><span>✓</span>Подготовка</button>
        <button data-mobile-toast="Профиль проекта демонстрационный"><span>○</span>Профиль</button>
      </nav>
      <div class="mobile-toast" id="mobileToast" role="status" aria-live="polite"></div>
    </div>
    <script src="mobile.js?v=mobile-app-1"></script>
  </body>
</html>
